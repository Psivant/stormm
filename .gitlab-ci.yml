default:
  tags:
    - gcp

stages:
  - test
  - build_docker
  - build_singularity

test:
  stage: test
  allow_failure: true  # Allow pipeline to continue even if tests fail
  image: nvidia/cuda:12.8.1-devel-ubuntu22.04

  script:
    - apt update -y
    - apt clean   
    - apt install wget -y
    - apt install python3-pip -y
    - export DEBIAN_FRONTEND=noninteractive
    - export TZ=UTC
    - apt install tzdata -y
    - apt install gcovr -y
    - apt install git -y
    - apt install libeigen3-dev -y
    - apt install libboost-all-dev -y
    - apt install gcc g++ -y
    - apt install cmake -y

    # The nvidia/cuda:12.8.1-devel base image already ships the full CUDA 12.8
    # toolkit (nvcc, cublas, headers). Do NOT re-add NVIDIA's apt repo or
    # reinstall cuda-toolkit-12-8: the repo now serves newer 12.8 patches whose
    # cuda-libraries-12-8 requires libcublas >= 12.8.5.5, which conflicts with
    # the image's pinned 12.8.4.1 and fails with "held broken packages".
    - export PATH=/usr/local/cuda/bin:$PATH
    - export CUDADIR=/usr/local/cuda
    - export CXXFLAGS="-I/usr/local/cuda/include $CXXFLAGS"
    - export LDFLAGS="-L/usr/local/cuda/lib64 $LDFLAGS"

    - nvcc --version
    - nvidia-smi

    - rm -rf build deploy  # Clean old build artifacts

    - CUDA_VISIBLE_DEVICES=$CI_RUNNER_ID

    - mkdir build && cd build

    - cmake -DCMAKE_BUILD_TYPE=RELEASE 
            -DSTORMM_ENABLE_CUDA=NO
            -DSTORMM_ENABLE_RDKIT=NO 
            -DSTORMM_ENABLE_TEST_COVERAGE=YES 
            -DCMAKE_INSTALL_PREFIX=${CI_PROJECT_DIR}/deploy 
            -DCUSTOM_NVCC_THREADS=8 ..
    - make -j
    - make test -j
    - gcovr --xml-pretty --exclude-unreachable-branches --gcov-ignore-parse-errors --print-summary -o coverage.xml --root ${CI_PROJECT_DIR}

    - cmake -DCMAKE_BUILD_TYPE=RELEASE 
            -DSTORMM_ENABLE_CUDA=YES 
            -DSTORMM_ENABLE_RDKIT=NO 
            -DSTORMM_ENABLE_TEST_COVERAGE=YES 
            -DCMAKE_INSTALL_PREFIX=${CI_PROJECT_DIR}/deploy 
            -DCUSTOM_NVCC_THREADS=8 ..
    - make -j
    - make test -j
    - gcovr --xml-pretty --exclude-unreachable-branches --gcov-ignore-parse-errors --print-summary -o coverage.xml --root ${CI_PROJECT_DIR}

    - make install

    - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${CI_PROJECT_DIR}/deploy/lib/
    - export PATH=$PATH:${CI_PROJECT_DIR}/deploy/bin/

    - cd ${CI_PROJECT_DIR}

    - conformer.stormm.cuda --help
    - ffrefine.stormm.cuda --help

  parallel:
    matrix:
      - NEO_TAG: ["gpu"]

  coverage: /^\s*lines:\s*\d+.\d+\%/

  artifacts:
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    expire_in: 2 days
    paths:
      - build/Testing/Temporary/LastTest.log
      - ${CI_PROJECT_DIR}/build/Testing/Temporary/LastTest.log
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage.xml

build_docker:
  stage: build_docker
  needs: ["test"]
  image: google/cloud-sdk:latest
  before_script:
    - echo $GCP_SERVICE_KEY | base64 -d > gcloud-service-key.json
    - gcloud auth activate-service-account --key-file=gcloud-service-key.json
    - gcloud config set project psivant-data
  script:
    - echo "Building STORMM CUDA image"
    - echo "CI_COMMIT_SHA:" $CI_COMMIT_SHA
    
    # Submit build to Cloud Build
    - |
      gcloud builds submit \
        --project psivant-data \
        --machine-type=e2-highcpu-32 \
        --tag us-docker.pkg.dev/psivant-data/containers/stormm:$CI_COMMIT_SHA \
        --timeout=3h \
        --region us-central1 .

    # Tag as latest based on branch
    - |
        gcloud artifacts docker tags add \
          us-docker.pkg.dev/psivant-data/containers/stormm:$CI_COMMIT_SHA \
          us-docker.pkg.dev/psivant-data/containers/stormm:$CI_COMMIT_BRANCH

    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        gcloud artifacts docker tags add \
          us-docker.pkg.dev/psivant-data/containers/stormm:$CI_COMMIT_SHA \
          us-docker.pkg.dev/psivant-data/containers/stormm:latest
      fi

  only:
    - development
    - main
    - test_build

build_singularity:
  needs: [build_docker]
  image: ubuntu:22.04
  stage: build_singularity
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -y
    - apt-get install -y --no-install-recommends curl ca-certificates gnupg python3

    # Install SingularityCE 4.4.2 from the official .deb (stable, versioned —
    # no Alpine edge/testing soname roulette). apt resolves its deps
    # (squashfs-tools, cryptsetup, etc.) from Ubuntu's own repos.
    - curl -fSL -o singularity-ce.deb https://github.com/sylabs/singularity/releases/download/v4.4.2/singularity-ce_4.4.2-jammy_amd64.deb
    - apt-get install -y ./singularity-ce.deb
    - rm singularity-ce.deb

    # gcloud SDK (for gsutil + access token).
    - curl -O https://dl.google.com/dl/cloudsdk/release/google-cloud-sdk.tar.gz
    - tar -xzf google-cloud-sdk.tar.gz
    - ./google-cloud-sdk/install.sh -q
    - rm google-cloud-sdk.tar.gz
    - export PATH="$PATH:$(pwd)/google-cloud-sdk/bin"

    # Authenticate with the GCP service-account key. The runner VM's keyless
    # metadata token only carries the devstorage.read_only scope — enough to
    # pull from Artifact Registry, but gsutil uploads fail with
    # "403 Provided scope(s) are not authorized". The SA key grants the
    # cloud-platform scope, so both the docker:// pull and the GCS uploads work.
    - echo "$GCP_SERVICE_KEY" | base64 -d > gcloud-service-key.json
    - gcloud auth activate-service-account --key-file=gcloud-service-key.json
    - gcloud auth configure-docker us-docker.pkg.dev -q
  script:
    - |
      PROJECT_NAME_LOWER=$(echo "$CI_PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
      IMAGE="us-docker.pkg.dev/psivant-data/containers/${PROJECT_NAME_LOWER}:${CI_COMMIT_SHA}"
      SIF="${PROJECT_NAME_LOWER}-${CI_COMMIT_BRANCH}.sif"

      # Pull the image straight from Artifact Registry into the SIF — no Docker
      # daemon / dind. Singularity authenticates with the service account's
      # access token (minted from the key activated in before_script).
      export SINGULARITY_DOCKER_USERNAME=oauth2accesstoken
      export SINGULARITY_DOCKER_PASSWORD="$(gcloud auth print-access-token)"
      singularity build "$SIF" "docker://${IMAGE}"

      # Only publish to the production buckets from the real branches. Test
      # branches still build + auth + pull, but don't pollute prod.
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "development" ]; then
        gsutil cp "$SIF" "gs://singularity-images/${CI_PROJECT_NAME}/"
        gsutil cp "$SIF" "gs://cluster-software-prod/images/"
      fi

  only:
    - development
    - main
    - test_build